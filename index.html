<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Service Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,"Microsoft YaHei";
}

body{
    background:#f5f7fb;
    color:#333;
}

.header{
    background:#1e293b;
    color:white;
    padding:20px 40px;
    font-size:24px;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:30px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.title{
    font-size:28px;
    margin-bottom:15px;
}

.desc{
    color:#666;
    line-height:1.8;
}

.button{
    display:inline-block;
    margin-top:20px;
    background:#2563eb;
    color:white;
    padding:12px 25px;
    border-radius:8px;
    text-decoration:none;
}

.status{
    color:#16a34a;
    font-weight:bold;
}

.footer{
    text-align:center;
    padding:30px;
    color:#888;
}
</style>

</head>

<body>

<div class="header">
    ☁ Cloud Management Center
</div>


<div class="container">

<div class="card">
<h1 class="title">
服务器管理平台
</h1>

<p class="desc">
欢迎使用云端服务管理系统。
这里可以查看服务器状态、资源使用情况以及系统信息。
</p>

<a class="button" href="#">
进入控制台
</a>

</div>


<div class="card">

<h2>系统状态</h2>

<p>
服务器状态：
<span class="status">
运行正常
</span>
</p>

<p>
CPU 使用率：32%
</p>

<p>
内存使用率：45%
</p>

<p>
网络状态：良好
</p>

</div>


<div class="card">

<h2>服务介绍</h2>

<p class="desc">
本页面为纯 HTML 静态展示页面，
无需数据库，无需后台程序。
可以部署到 Cloudflare Pages、GitHub Pages 或普通服务器。
</p>

</div>


</div>


<div class="footer">
© 2026 Cloud Service Demo
</div>


</body>
</html>
